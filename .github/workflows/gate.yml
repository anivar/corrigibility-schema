name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema[format]>=4.18" referencing
      - name: Schemas + examples validate
        run: python tools/check-examples.py
      - name: Every paper concept has its home
        run: python tools/check-concepts.py
